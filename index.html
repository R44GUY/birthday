<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday 💖</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💖</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Great+Vibes&family=Playfair+Display:ital,wght@0,500;1,400&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="bg"></canvas>
<audio id="music" src="music.mp3" loop preload="none"></audio>
<button id="mute" hidden aria-label="Toggle music">🔊</button>

<section id="intro">
  <div class="heart-btn" id="open" role="button" tabindex="0" aria-label="Open your surprise">💌</div>
  <p class="script">I made something for you…</p>
  <small>tap the envelope</small>
</section>

<main id="main" class="hidden">
  <section class="hero" id="hero">
    <h1><span id="t1" class="script t1"></span><span id="name" class="name"></span></h1>
    <p id="sub" class="sub"></p>
  </section>

  <section class="reveal" id="wish">
    <h2>Make a wish</h2>
    <div class="cake" id="cake" role="button" tabindex="0" aria-label="Cake">
      <div class="candles"><i></i><i></i><i></i></div>
      <div class="l l3"></div><div class="l l2"></div><div class="l l1"></div>
    </div>
    <button id="blow">Blow out the candles 🕯️</button>
    <p id="wishmsg" class="script"></p>
  </section>

  <section class="reveal" id="moments">
    <h2>Our little moments</h2>
    <div class="strings" id="gallery"></div>
  </section>

  <section class="reveal" id="reasons">
    <h2>Why I love you</h2>
    <p class="hint">tap a heart</p>
    <div class="cards" id="reasonlist"></div>
  </section>

  <section class="reveal" id="letter">
    <div class="env" id="env" role="button" tabindex="0" aria-label="Open the letter"></div>
    <p class="hint" id="envhint">tap to open my letter</p>
    <div class="letter" id="letterbody"></div>
  </section>

  <footer class="finale reveal" id="finale">
    <div class="bigheart" id="bigheart" role="button" tabindex="0" aria-label="Send love">❤</div>
    <p class="script" id="fin"></p>
  </footer>

  <nav id="dots" aria-label="Sections"></nav>
  <button id="next" aria-label="Scroll to next section">↓</button>
</main>

<div id="lightbox"><img id="lbimg" alt=""><p class="script" id="lbcap"></p></div>
<script src="script.js"></script>
</body>
</html>
